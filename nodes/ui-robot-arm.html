<script type="text/javascript">
  RED.nodes.registerType('ui-robot-arm', {
    category: RED._('@flowfuse/node-red-dashboard/ui-base:ui-base.label.category') || 'dashboard 2',
    color: '#3D7EA6',
    defaults: {
      name: { value: '' },
      group: { type: 'ui-group', required: true },
      order: { value: 0 },
      width: {
        value: 6,
        validate: function (v) {
          const width = v || 0;
          const currentGroup = $('#node-input-group').val() || this.group;
          const groupNode = RED.nodes.node(currentGroup);
          const valid = !groupNode || +width <= +groupNode.width;
          $('#node-input-size').toggleClass('input-error', !valid);
          return valid;
        }
      },
      height: { value: 6 },
      robot: { value: '', required: true }
    },
    inputs: 0,
    outputs: 0,
    icon: 'font-awesome/fa-cube',
    paletteLabel: 'ui-robot-arm',
    label: function () {
      return this.name || 'ui-robot-arm';
    },
    oneditprepare: function () {
      $('#node-input-size').elementSizer({
        width: '#node-input-width',
        height: '#node-input-height',
        group: '#node-input-group'
      });
      const select = $('#node-input-robot');
      const current = this.robot;
      select.empty();
      select.append($('<option></option>').val('').text('— select robot node —'));
      RED.nodes.eachNode(function (n) {
        if (n.type === 'robot') {
          const label = (n.name || 'robot') + ' [' + n.id + ']';
          select.append($('<option></option>').val(n.id).text(label));
        }
      });
      select.val(current || '');
    }
  });
</script>

<script type="text/html" data-template-name="ui-robot-arm">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-group"><i class="fa fa-table"></i> Group</label>
    <input type="text" id="node-input-group">
  </div>
  <div class="form-row">
    <label><i class="fa fa-object-group"></i> Size</label>
    <input type="hidden" id="node-input-width">
    <input type="hidden" id="node-input-height">
    <button class="editor-button" id="node-input-size"></button>
  </div>
  <div class="form-row">
    <label for="node-input-robot"><i class="fa fa-android"></i> Robot</label>
    <select id="node-input-robot"></select>
  </div>
  <div class="form-tips">
    Embeds the 3D URDF viewer for the selected <b>robot</b> node (same-origin iframe of
    <code>/robot-arm/view/&lt;id&gt;</code>). Place on the same Dashboard 2 page as
    <b>ui-robot-controller</b>.
  </div>
</script>

<script type="text/html" data-help-name="ui-robot-arm">
  <p>Dashboard 2 widget: 3D UR5e viewer bound to a <b>robot</b> palette node.</p>
  <p>Requires <code>@flowfuse/node-red-dashboard</code>. Standalone HTTP view still works without Dashboard.</p>
  <h3>More</h3>
  <p><a href="https://github.com/t-teja/node-red-contrib-robot-arm#readme" target="_blank">Usage guide on GitHub</a></p>
</script>
